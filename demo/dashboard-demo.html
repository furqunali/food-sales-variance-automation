    --good:#0ca30c; --warn:#e8a33d; --bad:#d03b3b;
    --surface:#ffffff; --plane:#eef1f6; --ink:#12233d; --ink-2:#55637a; --muted:#8a94a6;
    --grid:#e8ecf2; --line:#dbe0e8; --ring:rgba(18,35,61,.08); --shadow:0 1px 3px rgba(18,35,61,.06),0 8px 22px rgba(18,35,61,.07);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  body[data-theme="royal"]{--brand:#26307a;--brand-2:#37429e;--accent:#4c6ef5;--accent-d:#3b5bdb}
  body[data-theme="emerald"]{--brand:#0b5d4e;--brand-2:#0e7a63;--accent:#10b981;--accent-d:#0d9668}
  body[data-theme="sunset"]{--brand:#7a2f4f;--brand-2:#a03a5f;--accent:#f97316;--accent-d:#ea6a0c}
  body[data-theme="graphite"]{--brand:#232f3b;--brand-2:#33465a;--accent:#38bdf8;--accent-d:#0ea5e9}
  body.dark{--surface:#171b23;--plane:#0d1015;--ink:#eef2f8;--ink-2:#aeb8c9;--muted:#7e8a9c;--grid:#262c37;--line:#2c3340;--ring:rgba(255,255,255,.10);--shadow:0 1px 3px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  .wrap{max-width:1220px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  /* nav */
  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;border-bottom:3px solid var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .topbar .wrap{display:flex;align-items:center;gap:14px;height:60px;max-width:none;padding:0 26px}
  .logo{display:flex;flex-direction:column;line-height:1;flex:none}
  .logo b{font-size:15px;font-weight:800;letter-spacing:.02em;color:#f0c24b}
  .logo span{font-size:10px;color:#2ecc71;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  .byline{text-align:right;line-height:1.25;font-size:11px;font-weight:700;color:#2ecc71;flex:none;margin-left:4px}
  .byline span{display:block;font-size:9px;font-weight:600;color:#5fe0a0;letter-spacing:.04em}
  nav.tabs{display:flex;gap:4px;margin-left:6px;flex:1;justify-content:center;flex-wrap:nowrap}
  nav.tabs button{background:transparent;border:0;color:rgba(255,255,255,.8);font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
  nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
  nav.tabs button.on{background:#fff;color:var(--brand);font-weight:800}
  .ctrls{display:flex;align-items:center;gap:8px}
  .ctrls select,.ctrls button.mode{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font:inherit;font-size:12px;padding:6px 9px;border-radius:8px;cursor:pointer}
  .ctrls select option{color:#111}
  .ctrls button.mode{width:34px;height:31px;font-size:14px}
  .ctrls button.pdfbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;font:inherit;font-size:12px;font-weight:800;letter-spacing:.02em;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .ctrls button.pdfbtn:hover{background:var(--accent-d);border-color:var(--accent-d)}
  /* page */
  .page{display:none;padding:24px 0 60px;animation:fade .3s}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .phead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px}
  .phead h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
  .phead .badge{font-size:12px;color:var(--muted)}
  h2.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-d);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
  .kpi{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:15px 15px 13px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .val{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:6px;color:var(--brand)}
  .kpi .val.accent{color:var(--accent-d)} .kpi .val.bad{color:var(--bad)} .kpi .val.good{color:var(--good)}
  .kpi .note{font-size:11px;color:var(--ink-2);margin-top:3px}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(18,35,61,.14)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .card .nm{font-weight:800;font-size:15px} .card .id{color:var(--muted);font-weight:600;font-size:12px}
  .card .att{font-size:29px;font-weight:800;margin:7px 0 2px;letter-spacing:-.02em}
  .card .attlab{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .bar{height:8px;border-radius:99px;background:var(--grid);margin:9px 0 4px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--c)}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:7px}
  .mini b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:99px;text-transform:uppercase}
  .pill.g{background:rgba(12,163,12,.13);color:var(--good)} .pill.w{background:rgba(232,163,61,.18);color:#a9741b} .pill.b{background:rgba(208,59,59,.13);color:var(--bad)}
  /* panels & charts */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  .panel{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}
  .panel.full{grid-column:1/-1}
  .panel h3{margin:0 0 2px;font-size:15px;font-weight:800}
  .panel .cap{margin:0 0 12px;font-size:11.5px;color:var(--ink-2)}
  .legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px;font-size:11.5px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 2px var(--surface) inset}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .axis{fill:var(--muted);font-size:11px}.glab{fill:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums}
  .gridline{stroke:var(--grid);stroke-width:1}
  /* table */
  .tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--ring);border-radius:14px;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:9px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--brand);color:#fff;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;font-weight:700}
  tbody tr:nth-child(even){background:color-mix(in srgb,var(--accent) 5%,transparent)}
  tbody tr.total{background:var(--brand);color:#fff;font-weight:800}
  /* 3-month-average review flags */
  .flag{display:inline-block;margin-left:5px;color:#e8890c;font-size:12px;cursor:help;font-weight:700;transform:translateY(-1px)}
  td.flagged{background:rgba(232,137,12,.14);box-shadow:inset 3px 0 0 #e8890c}
  .rbanner{display:flex;align-items:flex-start;gap:10px;background:rgba(232,137,12,.12);border:1px solid rgba(232,137,12,.4);border-left:5px solid #e8890c;border-radius:12px;padding:12px 15px;margin:14px 0 4px;font-size:13px;color:var(--ink)}
  .rbanner .ic{font-size:17px;line-height:1.2}
  .rbanner b{color:#b06806}
  .rbanner.ok{background:rgba(12,163,12,.1);border-color:rgba(12,163,12,.35);border-left-color:var(--good)}

  .rbanner ul{margin:6px 0 0;padding-left:18px} .rbanner li{font-size:12px;color:var(--ink-2)}

  .neg{color:var(--bad)}.pos{color:var(--good)}

  .ins{background:var(--surface);border:1px solid var(--ring);border-left:4px solid var(--accent);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .ins.warn{border-left-color:var(--bad)}.ins.good{border-left-color:var(--good)}
  .ins h4{margin:0 0 5px;font-size:13px}.ins p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5}
  footer{margin-top:30px;padding:16px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  #tip{position:fixed;pointer-events:none;background:var(--brand);color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .1s;z-index:99;white-space:nowrap}
  #tip b{color:#fff;opacity:.85}
  @media (max-width:920px){.kpis{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
  /* print-preview class mirrors @media print for on-screen verification */
  body.pp{background:#fff;font-size:10.5px;width:1050px;margin:0 auto}
  body.pp .topbar,body.pp .no-print{display:none!important}
  body.pp .wrap{max-width:none;padding:0}
  body.pp .page:not(.on){display:none!important}
  body.pp .page.on{display:block!important;padding:0}
  body.pp .phead h1{font-size:17px} body.pp h2.sec{margin:8px 0 5px}
  body.pp .kpi .val{font-size:18px} body.pp .card .att{font-size:20px}
  body.pp .panel .cap{display:none} body.pp .panel h3{font-size:13px}
  body.pp .kpis,body.pp .cards{gap:7px} body.pp .grid2,body.pp .grid3{gap:8px}
  body.pp .panel svg{max-height:168px} body.pp .card,body.pp .kpi,body.pp .ins{break-inside:avoid}
  body.pp footer{display:none}
  @media print{
    @page{size:A4 landscape;margin:7mm}
    body{background:#fff;font-size:10.5px}
    .topbar{display:none}
    .no-print{display:none!important}
    .wrap{max-width:none;padding:0}
    .page:not(.on){display:none!important}
    .page.on{display:block!important;padding:0}
    .phead{margin-bottom:5px}.phead h1{font-size:17px}
    h2.sec{margin:8px 0 5px;font-size:9.5px}
    .kpi{padding:9px 11px}.kpi .val{font-size:18px}
    .card{padding:10px}.card .att{font-size:20px}
    .kpis,.cards{gap:7px}.grid2,.grid3{gap:8px}
    .panel{padding:9px 12px}.panel h3{font-size:13px}.panel .cap{display:none}
    .panel svg{max-height:168px}
    .card,.kpi,.ins,.tblwrap{box-shadow:none;break-inside:avoid;border-color:#cfd6df}
    .panel{box-shadow:none;border-color:#cfd6df}
    .legend{margin-top:5px}
    th,td{padding:5px 9px}
    thead th{position:static}
    footer{display:none}
  }
</style>

}

function buildStore(s){
 const rows=MD[s.id], y=AG[s.id].y,j=rows[CUR],a=y.actual/y.budget,st=statusOf(a);
 const fl=FLAGS[s.id]||{}, LI=MONS.length-1, flKeys=Object.keys(fl);
 const FM=m=>fl[m]?`<span class="flag" title="${(fl[m]||'').replace(/"/g,'&quot;')}">⚑</span>`:"";
 let h=`<div class="phead"><h1><span style="color:${s.hex}">${s.name}</span> · Site ${s.id}</h1><div class="badge">${MONS[CUR]} 2026 snapshot · YTD Jan–${LAST} trend</div></div>`;
 h+= flKeys.length
   ? `<div class="rbanner"><span class="ic">⚑</span><div><b>${flKeys.length} value(s) flagged for review</b> — ${MONS[LI]} figures that moved more than 1.5% from the 3-month average. Recheck against the source, then approve to clear.<ul>${flKeys.map(k=>`<li>${fl[k]}</li>`).join("")}</ul></div></div>`
   : `<div class="rbanner ok"><span class="ic">✓</span><div><b>All values within trend</b> — no ${MONS[LI]} value deviates more than 1.5% from its 3-month average (or all flags approved).</div></div>`;
 h+=kpiRow([
  {lab:MONS[CUR]+" Sales",val:fmtK(j.actual),note:"budget "+fmtK(j.budget)},
  {lab:MONS[CUR]+" Attainment",val:((j.actual/j.budget)*100).toFixed(0)+"%",cls:(j.actual/j.budget)>=.8?"good":(j.actual/j.budget)>=.6?"":"bad",note:"vs monthly budget"},
  {lab:"Kitchen INIR ("+MONS[CUR]+")",val:pct(j.inir),cls:"accent",note:"net food margin"},
  {lab:"GP % After Disc.",val:pct(j.gp_after),note:"before "+pct(j.gp_before)},
  {lab:"SOS ("+MONS[CUR]+")",val:j.sos.toFixed(1)+" min",note:j.customers.toLocaleString()+" customers"}
 ]);
 h+=`<h2 class="sec">Budget &amp; Sales</h2><div class="grid2">
   <div class="panel"><h3>YTD Budget Attainment <span class="pill ${st.c}" style="margin-left:6px">${st.t}</span></h3><p class="cap">YTD actual ${fmtK(y.actual)} of ${fmtK(y.budget)}</p><div id="sG"></div></div>
   <div class="panel"><h3>Sales Composition (YTD)</h3><p class="cap">C-Store · Kitchen · Fountain</p><div id="sComp"></div></div>
   <div class="panel full"><h3>Monthly Sales — Actual vs Budget</h3><p class="cap">Jan–${LAST} 2026</p><div id="sMon"></div></div></div>`;
 h+=`<h2 class="sec">Food Margin &amp; Operations</h2><div class="grid2">
   <div class="panel full"><h3>Margin Trend</h3><p class="cap">GP% before/after discount &amp; INIR net margin</p><div id="sMargin"></div></div>
   <div class="panel"><h3>Kitchen Sales Trend</h3><p class="cap">Monthly kitchen $</p><div id="sKitch"></div></div>
   <div class="panel"><h3>SOS &amp; Customers</h3><p class="cap">Speed of service (min) trend</p><div id="sSos"></div></div></div>`;
 h+=`<h2 class="sec">Monthly Sales Summary</h2><div class="tblwrap"><table id="sTbl"></table></div>`;
 // --- NEW: kitchen product mix ---
 h+=`<h2 class="sec">Kitchen Product Mix</h2><div class="grid2">
   <div class="panel"><h3>Product Mix (${MONS[CUR]})</h3><p class="cap">Kitchen sales by category</p><div id="sMix"></div></div>
   <div class="panel"><h3>${MONS[CUR]} Cost &amp; Discount Buckets</h3><p class="cap">Dollars that erode kitchen margin</p><div id="sLeak"></div></div>
   <div class="panel full"><h3>Monthly Kitchen Breakdown</h3><p class="cap">Jan–${LAST} product-mix sales ($)</p><div class="tblwrap"><table id="sKitTbl"></table></div></div></div>`;
 // --- NEW: food-margin breakdown ---
 h+=`<h2 class="sec">Food Margin Breakdown</h2><div class="tblwrap"><table id="sMarTbl"></table></div>`;
 // --- NEW: customer counts ---
 h+=`<h2 class="sec">Customer Counts</h2><div class="tblwrap"><table id="sCustTbl"></table></div>`;
 // --- NEW: ending inventory snapshot ---
 h+=`<h2 class="sec">Ending Inventory — latest snapshot</h2><p class="cap" style="margin:-6px 0 12px">Point-in-time ending inventory by department (${LAST} 2026). Variance = Targeted − Ending (negative = over target).</p><div class="tblwrap"><table id="sInvTbl"></table></div>`;
 // --- price overrides (per store, when the override source provides them) ---
 if(EX[s.id]&&EX[s.id].override){h+=`<h2 class="sec">Price Override Counts</h2><div class="grid2"><div class="panel full"><h3>Monthly Price Overrides</h3><p class="cap">Register price-override events, Jan–${LAST}</p><div id="sOvr"></div></div></div>`;}
 const pg=$("#pg-"+s.id);pg.innerHTML=h;  // scope all lookups below to THIS store's page (ids repeat across store pages)
 gauge(pg.querySelector("#sG"),a,s.hex);
 donut(pg.querySelector("#sComp"),[{label:"C-Store",value:y.cstore,hex:"#2a78d6"},{label:"Kitchen",value:y.kitchen,hex:"#1baf7a"},{label:"Fountain",value:y.fountain,hex:"#eda100"}],fmtK);
 barLine(pg.querySelector("#sMon"),rows,{});
 multiLine(pg.querySelector("#sMargin"),[
   {name:"GP% before",hex:"#2a78d6",vals:rows.map(r=>r.gp_before)},
   {name:"GP% after disc.",hex:"#1baf7a",vals:rows.map(r=>r.gp_after)},
   {name:"INIR net margin",hex:s.hex,vals:rows.map(r=>r.inir)}
 ],v=>pct(v),{yfmt:v=>(v*100).toFixed(0)+"%"});
 multiLine(pg.querySelector("#sKitch"),[{name:"Kitchen $",hex:s.hex,vals:rows.map(r=>r.kitchen)}],fmtK,{yfmt:v=>"$"+Math.round(v/1000)+"K",min:0});
 multiLine(pg.querySelector("#sSos"),[{name:"SOS (min)",hex:"#eda100",vals:rows.map(r=>r.sos)}],v=>v.toFixed(1)+" min",{});
 // sales summary table
 let th=`<thead><tr><th>Month</th><th>Actual</th><th>Budget</th><th>Attain</th><th>C-Store</th><th>Kitchen</th><th>Fountain</th><th>INIR</th><th>GP After</th><th>SOS</th></tr></thead><tbody>`;
 rows.forEach(r=>{const at=r.actual/r.budget;const F=r.m===MONS[LI];const C=(m,inner)=>`<td${F&&fl[m]?' class="flagged"':''}>${inner}${F?FM(m):''}</td>`;
   th+=`<tr><td>${r.m}</td>${C('actual',fmtD(r.actual))}<td>${fmtD(r.budget)}</td><td class="${at>=.8?'pos':at<.6?'neg':''}">${(at*100).toFixed(0)}%</td>${C('cstore',fmtD(r.cstore))}${C('kitchen',fmtD(r.kitchen))}${C('fountain',fmtD(r.fountain))}${C('inir',pct(r.inir))}${C('gp_after',pct(r.gp_after))}${C('sos',r.sos.toFixed(1))}</tr>`;});
 th+=`<tr class="total"><td>YTD</td><td>${fmtD(y.actual)}</td><td>${fmtD(y.budget)}</td><td>${pct(a)}</td><td>${fmtD(y.cstore)}</td><td>${fmtD(y.kitchen)}</td><td>${fmtD(y.fountain)}</td><td>${pct(rows.reduce((x,r)=>x+r.inir,0)/7)}</td><td>${pct(rows.reduce((x,r)=>x+r.gp_after,0)/7)}</td><td>${(rows.reduce((x,r)=>x+r.sos,0)/7).toFixed(1)}</td></tr></tbody>`;
 pg.querySelector("#sTbl").innerHTML=th;
 // kitchen product-mix donut (July) + leak buckets
 const mixItems=KCATS.map(([k,lab],i)=>({label:lab,value:j[k],hex:KCOLS[i]})).filter(d=>d.value>0);
 donut(pg.querySelector("#sMix"),mixItems,fmtD);
 const leakHex=["#eb6834","#d03b3b","#eda100","#4a3aa7","#8a94a6"];
 hbars(pg.querySelector("#sLeak"),[
   {label:"Discount $",value:j.disc_d},{label:"Wastage $",value:j.wastage_d},{label:"Sampling $",value:j.sampling_d},{label:"Spoilage $",value:j.spoilage_d},{label:"Logo Cups $",value:j.logo_d}
 ].map((d,i)=>({...d,hex:leakHex[i]})),fmtD,{tip:fmtD,labW:96});
 // monthly kitchen breakdown table
 let kt=`<thead><tr><th>Month</th><th>Hot Grab</th><th>Cold Grab</th><th>Bakery</th><th>MTO Food</th><th>MTO Coffee</th><th>Delivery</th><th>Catering</th><th>Midax</th><th>Total</th></tr></thead><tbody>`;
 const ktot={hotgrab:0,coldgrab:0,bakery:0,mtofood:0,mtocoffee:0,delivery:0,catering:0,midax:0};
 rows.forEach(r=>{const t=r.hotgrab+r.coldgrab+r.bakery+r.mtofood+r.mtocoffee+r.delivery+r.catering+r.midax;for(const k in ktot)ktot[k]+=r[k];
   kt+=`<tr><td>${r.m}</td><td>${fmtD(r.hotgrab)}</td><td>${fmtD(r.coldgrab)}</td><td>${fmtD(r.bakery)}</td><td>${fmtD(r.mtofood)}</td><td>${fmtD(r.mtocoffee)}</td><td>${fmtD(r.delivery)}</td><td>${fmtD(r.catering)}</td><td>${fmtD(r.midax)}</td><td>${fmtD(t)}</td></tr>`;});
 const ktT=Object.values(ktot).reduce((x,v)=>x+v,0);
 kt+=`<tr class="total"><td>YTD</td><td>${fmtD(ktot.hotgrab)}</td><td>${fmtD(ktot.coldgrab)}</td><td>${fmtD(ktot.bakery)}</td><td>${fmtD(ktot.mtofood)}</td><td>${fmtD(ktot.mtocoffee)}</td><td>${fmtD(ktot.delivery)}</td><td>${fmtD(ktot.catering)}</td><td>${fmtD(ktot.midax)}</td><td>${fmtD(ktT)}</td></tr></tbody>`;
 pg.querySelector("#sKitTbl").innerHTML=kt;
 // monthly margin breakdown table
 let mt=`<thead><tr><th>Month</th><th>GP Before</th><th>Disc %</th><th>Disc $</th><th>Wastage $</th><th>Sampling $</th><th>Spoilage $</th><th>Logo $</th><th>INIR</th><th>Shrink $</th><th>Shrink %</th></tr></thead><tbody>`;
 rows.forEach(r=>{const F=r.m===MONS[LI];const C=(m,inner)=>`<td${F&&fl[m]?' class="flagged"':''}>${inner}${F?FM(m):''}</td>`;
   mt+=`<tr><td>${r.m}</td>${C('gp_before',pct(r.gp_before))}<td>${pct(r.disc_pct)}</td><td>${fmtD(r.disc_d)}</td>${C('wastage',fmtD(r.wastage_d))}${C('sampling',fmtD(r.sampling_d))}<td>${fmtD(r.spoilage_d)}</td>${C('logo',fmtD(r.logo_d))}${C('inir',pct(r.inir))}<td class="${r.shrink_d<0?'neg':'pos'}">${fmtD(r.shrink_d)}</td><td class="${r.shrink<0?'neg':'pos'}">${pct(r.shrink)}</td></tr>`;});
 pg.querySelector("#sMarTbl").innerHTML=mt+`</tbody>`;
 // customer counts table
 let ct=`<thead><tr><th>Month</th><th>Total Customers</th><th>Crind</th><th>DR MOP</th><th>Avg Cust / Day</th><th>Avg Sales / Cust</th></tr></thead><tbody>`;
 rows.forEach(r=>{const F=r.m===MONS[LI];const C=(m,inner)=>`<td${F&&fl[m]?' class="flagged"':''}>${inner}${F?FM(m):''}</td>`;
   ct+=`<tr><td>${r.m}</td>${C('customers',r.customers.toLocaleString())}<td>${r.crind.toLocaleString()}</td><td>${r.drmop.toLocaleString()}</td><td>${r.avgcust.toLocaleString()}</td><td>$${r.avgspc.toFixed(2)}</td></tr>`;});
 pg.querySelector("#sCustTbl").innerHTML=ct+`</tbody>`;
 // ending inventory snapshot table
 const inv=(EX[s.id]&&EX[s.id].inv)||[];
 let it=`<thead><tr><th>Department</th><th>Targeted</th><th>Ending Inv</th><th>Variance</th></tr></thead><tbody>`;
 inv.forEach(d=>{const gt=/grand total/i.test(d.dept);it+=`<tr class="${gt?'total':''}"><td>${d.dept}</td><td>${fmtD(d.targeted)}</td><td>${fmtD(d.ending)}</td><td class="${gt?'':(d.var<0?'neg':'pos')}">${fmtD(d.var)}</td></tr>`;});
 pg.querySelector("#sInvTbl").innerHTML=it+`</tbody>`;
 // price overrides (per store)
 if(EX[s.id]&&EX[s.id].override){hbars(pg.querySelector("#sOvr"),EX[s.id].override.map((v,i)=>({label:MONS[i],value:v,hex:s.hex})),v=>v+"",{tip:v=>v+" overrides",labW:56});}
}

function buildTrends(){
 let h=`<div class="phead"><h1>Trends &amp; Comparison</h1><div class="badge">All stores · Jan–${LAST} 2026</div></div>`;
 h+=`<div class="grid2">
  <div class="panel full"><h3>Total Sales by Store</h3><p class="cap">Monthly actual sales, all stores</p><div id="tSales"></div></div>
  <div class="panel full"><h3>Kitchen INIR Margin</h3><p class="cap">Net food margin trend by store</p><div id="tInir"></div></div>
  <div class="panel"><h3>Attainment vs Budget</h3><p class="cap">Monthly actual ÷ budget</p><div id="tAtt"></div></div>
  <div class="panel"><h3>Speed of Service</h3><p class="cap">Kitchen product time (min)</p><div id="tSos"></div></div></div>`;
 $("#pg-trends").innerHTML=h;
 multiLine($("#tSales"),STORES.map(s=>({name:s.name,hex:s.hex,vals:MD[s.id].map(r=>r.actual)})),fmtK,{yfmt:v=>"$"+Math.round(v/1000)+"K",min:0});
 multiLine($("#tInir"),STORES.map(s=>({name:s.name,hex:s.hex,vals:MD[s.id].map(r=>r.inir)})),pct,{yfmt:v=>(v*100).toFixed(0)+"%"});
 multiLine($("#tAtt"),STORES.map(s=>({name:s.name,hex:s.hex,vals:MD[s.id].map(r=>r.actual/r.budget)})),pct,{yfmt:v=>(v*100).toFixed(0)+"%"});
 multiLine($("#tSos"),STORES.map(s=>({name:s.name,hex:s.hex,vals:MD[s.id].map(r=>r.sos)})),v=>v.toFixed(1),{yfmt:v=>v.toFixed(0)});
}

function buildData(){
 let h=`<div class="phead"><h1>Data Table</h1><div class="badge">YTD summary + full monthly data · all stores</div></div>`;
 h+=`<h2 class="sec">YTD Summary (${MONS[CUR]} focus)</h2><div class="tblwrap"><table><thead><tr><th>Store</th><th>YTD Actual</th><th>YTD Budget</th><th>Attain %</th><th>${MONS[CUR]} Actual</th><th>C-Store</th><th>Kitchen</th><th>Fountain</th><th>INIR %</th><th>SOS</th></tr></thead><tbody>`;
 STORES.forEach(s=>{const y=AG[s.id].y,a=y.actual/y.budget,j=MD[s.id][CUR];h+=`<tr><td><span class="dot" style="background:${s.hex}"></span>${s.name} ${s.id}</td><td>${fmtD(y.actual)}</td><td>${fmtD(y.budget)}</td><td class="${a>=.8?'pos':a<.6?'neg':''}">${pct(a)}</td><td>${fmtD(j.actual)}</td><td>${fmtD(y.cstore)}</td><td>${fmtD(y.kitchen)}</td><td>${fmtD(y.fountain)}</td><td>${pct(j.inir)}</td><td>${j.sos.toFixed(2)}</td></tr>`;});
 const at=TOT.actual/TOT.budget;
 h+=`<tr class="total"><td>ALL STORES</td><td>${fmtD(TOT.actual)}</td><td>${fmtD(TOT.budget)}</td><td>${pct(at)}</td><td>${fmtD(STORES.reduce((x,s)=>x+MD[s.id][CUR].actual,0))}</td><td>${fmtD(TOT.cstore)}</td><td>${fmtD(TOT.kitchen)}</td><td>${fmtD(TOT.fountain)}</td><td>${pct(STORES.reduce((x,s)=>x+MD[s.id][CUR].inir,0)/4)}</td><td>${(STORES.reduce((x,s)=>x+MD[s.id][CUR].sos,0)/4).toFixed(2)}</td></tr></tbody></table></div>`;
 // full monthly grid: every store x every month
 h+=`<h2 class="sec">Full Monthly Data (Jan–${LAST})</h2><div class="tblwrap"><table><thead><tr><th>Store</th><th>Month</th><th>Actual</th><th>Budget</th><th>Attain</th><th>C-Store</th><th>Kitchen</th><th>Fountain</th><th>INIR</th><th>GP After</th><th>Shrink %</th><th>SOS</th><th>Customers</th></tr></thead><tbody>`;
 STORES.forEach(s=>{MD[s.id].forEach((r,i)=>{const at2=r.actual/r.budget;h+=`<tr${i===CUR?' style="background:color-mix(in srgb,var(--accent) 14%,transparent)"':''}><td><span class="dot" style="background:${s.hex}"></span>${s.name} ${s.id}</td><td>${r.m}</td><td>${fmtD(r.actual)}</td><td>${fmtD(r.budget)}</td><td class="${at2>=.8?'pos':at2<.6?'neg':''}">${(at2*100).toFixed(0)}%</td><td>${fmtD(r.cstore)}</td><td>${fmtD(r.kitchen)}</td><td>${fmtD(r.fountain)}</td><td>${pct(r.inir)}</td><td>${pct(r.gp_after)}</td><td class="${r.shrink<0?'neg':'pos'}">${pct(r.shrink)}</td><td>${r.sos.toFixed(1)}</td><td>${r.customers.toLocaleString()}</td></tr>`;});});
 h+=`</tbody></table></div>`;
 h+=`<footer><span>Data verified against source files (Weighted Average, Retail Dept Summary, Cost INIR/PDI, Hourly Sales, Customer Counts, Speed of Service).</span><span>Northwind Fuel &amp; Market — Sample / synthetic data</span></footer>`;
 $("#pg-data").innerHTML=h;
}

/* ================= ROUTER ================= */
const PAGES=[{id:"over",label:"Overview"}].concat(STORES.map(s=>({id:s.id,label:s.name+" "+s.id}))).concat([{id:"trends",label:"Trends"},{id:"data",label:"Data"}]);
$("#tabs").innerHTML=PAGES.map(p=>`<button data-tab="${p.id}">${p.label}</button>`).join("");
PAGES.forEach(p=>{const d=document.createElement("div");d.className="page";d.id="pg-"+p.id;$("#app").appendChild(d);});
let built={},curTab="over";
function show(id){
 if(!PAGES.some(p=>p.id===id))id="over";
 curTab=id;
 $$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===id));
 $$(".page").forEach(p=>p.classList.remove("on"));$("#pg-"+id).classList.add("on");
 if(!built[id]){built[id]=1;if(id==="over")buildOverview();else if(id==="trends")buildTrends();else if(id==="data")buildData();else buildStore(STORES.find(s=>s.id===id));}
 if(location.hash.slice(1)!==id)history.replaceState(null,"","#"+id);
 window.scrollTo({top:0});
}
addEventListener("hashchange",()=>show(location.hash.slice(1).replace("|pp","")));
if(location.hash.includes("|pp"))document.body.classList.add("pp");
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.tab);};
$("#app").onclick=e=>{const c=e.target.closest("[data-go]");if(c)show(c.dataset.go);};
// month selector: pick which month is the "focus" snapshot (KPIs, donuts, buckets). Tables/trends always show Jan–latest.
$("#month").innerHTML=MONS.map((m,i)=>`<option value="${i}">${m} 2026</option>`).join("");
$("#month").value=CUR;
$("#month").onchange=e=>{CUR=+e.target.value;built={};show(curTab);};  // rebuild current tab for the new focus month
$("#theme").onchange=e=>document.body.dataset.theme=e.target.value;
$("#mode").onclick=()=>document.body.classList.toggle("dark");
$("#print").onclick=()=>window.print();  // prints the current tab only — compact 1-2 pages for directors
$("#csv").onclick=()=>{
 let rows=[["Store","Month","Actual","Budget","Attain%","C-Store","Kitchen","Fountain","INIR%","GP_after%","Shrink%","SOS_min","Customers"]];
 STORES.forEach(s=>MD[s.id].forEach(r=>rows.push([s.name+" "+s.id,r.m,r.actual,r.budget,((r.actual/r.budget)*100).toFixed(1),r.cstore,r.kitchen,r.fountain,(r.inir*100).toFixed(1),(r.gp_after*100).toFixed(1),(r.shrink*100).toFixed(1),r.sos,r.customers])));
 const csv=rows.map(r=>r.join(",")).join("\n");const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);
 const a=document.createElement("a");a.href=u;a.download="Food_Sales_Budget_Variance_Data_2026.csv";a.click();URL.revokeObjectURL(u);
};
show((location.hash.slice(1).replace("|pp",""))||"over");
</script>
